name: Sync upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with upstream
        uses: actions/github-script@v7
        with:
          script: |
            const upstream = 'yetone/magpie';
            const fork = context.repo;
            const branch = 'main';
            const ref = await github.rest.git.getRef({
              owner: upstream.split('/')[0],
              repo: upstream.split('/')[1],
              ref: `heads/${branch}`,
            });
            await github.rest.repos.mergeUpstream({
              owner: fork.owner,
              repo: fork.repo,
              branch,
            });
            core.info(`Upstream ${upstream}@${ref.data.object.sha} merged into ${fork.owner}/${fork.repo}@${branch}`);
